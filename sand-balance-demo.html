<script>
/* Standalone offline sand variant: true fine-grained glyph fragments, gentle lateral flow. Fictional amount only. No requests, storage or libraries.
   Original glyph pixels are partitioned once. No text/particle opacity crossfade. */
(function(){
'use strict';
const W=640,H=150,COUNT=1800,DURATION=700,AMOUNT='128 450 ₽',INK='#232930';
const canvas=document.getElementById('balance'),button=document.getElementById('toggle');
const ctx=canvas.getContext('2d',{alpha:true});
const source=document.createElement('canvas');source.width=W;source.height=H;
const sourceCtx=source.getContext('2d',{willReadFrequently:true});
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
let chips=[],atlas=null,ready=false,preparing=false,hidden=false,progress=0,animation=null,raf=0;
let cssWidth=1,cssHeight=130,pixelRatio=1,initError=null,stats=null;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function smooth(x){let t=clamp(x);return clamp(t*t*t*(t*(t*6-15)+10));}
function motion(p,spread){p=clamp(p);if(p===0||p===1)return p;const warp=(clamp(spread,0,.12)-.06)*.36;const t=clamp(p+warp*Math.sin(Math.PI*p));return clamp(.12*t+.88*smooth(t));}
function localMotion(p,q){p=clamp(p);return p===0||p===1?0:clamp((1-Math.exp(-p*DURATION/45))*(1-q)*(1-q));}
// Shared, gently curved flow; nearby source fragments inherit a similar bend.
function flightBend(x,y,ax,ay){return {x:26+4*Math.sin(y/30+x/220)+ax*.1,y:4*Math.sin(x/150+y/70)+ay*.1};}
// Zero angular velocity at both endpoints; no spring or idle motion.
function turnMotion(q){q=clamp(q);return q*q*(3-2*q);}
function rotationAt(rotation,spread,q,local){if(q<=0)return 0;if(q>=1)return rotation;const turn=turnMotion(q);return rotation*turn+.14*Math.sin(Math.PI*turn)+(spread-.06)*2*local;}
function position(a,b,arc,q,local=0){return q<=0?a+local:q>=1?b:a+(b-a)*q+arc*Math.sin(Math.PI*q)+local;}
function shortest(a){while(a>Math.PI/2)a-=Math.PI;while(a< -Math.PI/2)a+=Math.PI;return a;}
function field(x,y,v){const dx=x-320,dy=y-75;return .68*Math.sin(dx/92+.38*Math.sin(dy/34))+.22*Math.sin(dy/22-dx/170)+(clamp(v)-.5)*.36;}
/* java.util.Random's exact 48-bit LCG, implemented with safe 16-bit limbs.
   The two positive seeds used here match the native demo, without requiring BigInt. */
class JavaRandom{
 constructor(seed){this.a=(seed&65535)^0xe66d;this.b=(Math.floor(seed/65536)&65535)^0xdeec;this.c=(Math.floor(seed/4294967296)&65535)^5;this.spare=null;}
 next(bits){let t=this.a*0xe66d+11;const a=t&65535;let carry=Math.floor(t/65536);t=this.b*0xe66d+this.a*0xdeec+carry;const b=t&65535;carry=Math.floor(t/65536);t=this.c*0xe66d+this.b*0xdeec+this.a*5+carry;this.a=a;this.b=b;this.c=t&65535;return Math.floor((this.c*4294967296+this.b*65536+this.a)/Math.pow(2,48-bits));}
 float(){return this.next(24)/16777216;}
 double(){return (this.next(26)*134217728+this.next(27))/9007199254740992;}
 gaussian(){if(this.spare!==null){const x=this.spare;this.spare=null;return x;}let a,b,s;do{a=2*this.double()-1;b=2*this.double()-1;s=a*a+b*b;}while(s>=1||s===0);const m=Math.sqrt(-2*Math.log(s)/s);this.spare=b*m;return a*m;}
}
function makeCloud(count){const r=new JavaRandom(49775),out=[];while(out.length<count){const x=r.gaussian()*92,y=r.gaussian()*21;if((x/270)**2+(y/53)**2<1)out.push({x:Math.fround(320+x),y:Math.fround(75+y)});}return out;}
function paintSource(){
 sourceCtx.clearRect(0,0,W,H);let size=116;
 const font=s=>`600 ${s}px "Balance Poppins", "Balance Cyrillic", sans-serif`;
 sourceCtx.font=font(size);size=Math.min(size,size*628/sourceCtx.measureText(AMOUNT).width);sourceCtx.font=font(size);
 const m=sourceCtx.measureText(AMOUNT),ascent=m.actualBoundingBoxAscent||size*.8,descent=m.actualBoundingBoxDescent||size*.2;
 sourceCtx.fillStyle=INK;sourceCtx.textBaseline='alphabetic';sourceCtx.fillText(AMOUNT,(W-m.width)/2,(H+ascent-descent)/2);
}
const yieldTask=()=>new Promise(resolve=>setTimeout(resolve,0));
/* Fully partition every glyph pixel into small isotropic Voronoi grains.
   Time-sliced preprocessing keeps the browser responsive even on slower phones. */
async function partition(data){
 const ink=[],strong=[];for(let i=0;i<W*H;i++){const a=data[i*4+3];if(a){ink.push(i);if(a>=128)strong.push(i);}}
 if(ink.length<COUNT)throw Error('Недостаточно пикселей в маске шрифта');
 const candidates=strong.length>=COUNT?strong:ink,n=candidates.length;
 const cx=new Int16Array(n),cy=new Int16Array(n);for(let i=0;i<n;i++){cx[i]=candidates[i]%W;cy[i]=Math.floor(candidates[i]/W);}
 const sx=new Int16Array(COUNT),sy=new Int16Array(COUNT),nearest=new Float32Array(n);nearest.fill(Infinity);
 let next=Math.floor(n/2),budget=performance.now();
 for(let s=0;s<COUNT;s++){
  sx[s]=cx[next];sy[s]=cy[next];let farthest=-1,index=0;
  for(let j=0;j<n;j++){const dx=cx[j]-sx[s],dy=cy[j]-sy[s],d=dx*dx+dy*dy;if(d<nearest[j])nearest[j]=d;if(nearest[j]>farthest){farthest=nearest[j];index=j;}}
  next=index;if(performance.now()-budget>7){await yieldTask();budget=performance.now();}
 }
 // Isotropic grains need no tangent estimation or elongated distance metric.
 const angles=new Float32Array(COUNT);
 const owners=new Uint16Array(ink.length),left=new Int16Array(COUNT),top=new Int16Array(COUNT),right=new Int16Array(COUNT),bottom=new Int16Array(COUNT);left.fill(W);top.fill(H);right.fill(-1);bottom.fill(-1);
 for(let i=0;i<ink.length;i++){
  const x=ink[i]%W,y=Math.floor(ink[i]/W);let best=0,cost=Infinity;
  for(let s=0;s<COUNT;s++){const dx=x-sx[s],dy=y-sy[s],c=dx*dx+dy*dy;if(c<cost){cost=c;best=s;}}
  owners[i]=best;left[best]=Math.min(left[best],x);top[best]=Math.min(top[best],y);right[best]=Math.max(right[best],x);bottom[best]=Math.max(bottom[best],y);
  if((i&63)===0&&performance.now()-budget>7){await yieldTask();budget=performance.now();}
 }
 const parts=[];for(let s=0;s<COUNT;s++){
  if(right[s]<left[s])throw Error('Пустой фрагмент');
  const w=right[s]-left[s]+1,h=bottom[s]-top[s]+1;
  parts.push({left:left[s],top:top[s],w,h,x:sx[s]+.5,y:sy[s]+.5,tangent:angles[s],pixels:new Uint8ClampedArray(w*h*4)});
 }
 for(let i=0;i<ink.length;i++){
  const sourceIndex=ink[i],part=parts[owners[i]],target=((Math.floor(sourceIndex/W)-part.top)*part.w+sourceIndex%W-part.left)*4;
  for(let c=0;c<4;c++)part.pixels[target+c]=data[sourceIndex*4+c];
 }
 // Validate coverage and exact RGBA reassembly before enabling the control.
 const reconstructed=new Uint8ClampedArray(data.length),seen=new Uint8Array(W*H);let duplicated=0,visible=0,aa=0;
 for(const part of parts)for(let y=0;y<part.h;y++)for(let x=0;x<part.w;x++){
  const at=(y*part.w+x)*4;if(!part.pixels[at+3])continue;
  const pixel=(part.top+y)*W+part.left+x;if(seen[pixel]++)duplicated++;
  for(let c=0;c<4;c++)reconstructed[pixel*4+c]=part.pixels[at+c];visible++;if(part.pixels[at+3]<255)aa++;
 }
 let exact=duplicated===0;for(let i=0;i<data.length;i++)if(data[i]!==reconstructed[i]){exact=false;break;}
 if(!exact)throw Error('Проверка восстановления пикселей не пройдена');
 return {parts,visible,aa,exact};
}
function pack(parts){
 const padding=2,width=1024;let x=padding,y=padding,row=0;
 for(const p of parts){if(x+p.w+padding>width){x=padding;y+=row+padding;row=0;}p.atlasX=x;p.atlasY=y;x+=p.w+padding;row=Math.max(row,p.h);}
 const sheet=document.createElement('canvas');sheet.width=width;sheet.height=y+row+padding;
 const a=sheet.getContext('2d');for(const p of parts)a.putImageData(new ImageData(p.pixels,p.w,p.h),p.atlasX,p.atlasY);
 return sheet;
}
function updateSemantics(){
 const shown=progress===0&&!hidden;
 canvas.setAttribute('aria-label',shown?'Демонстрационный баланс: 128 тысяч 450 рублей':'Баланс скрыт');
 button.textContent=hidden?'Показать баланс':'Скрыть баланс';
 document.body.dataset.state=animation?(hidden?'hiding':'revealing'):(hidden?'hidden':ready?'visible':'preparing');
 document.body.dataset.progress=progress.toFixed(6);
 document.body.dataset.animating=String(!!animation);
}
function resize(){
 const rect=canvas.getBoundingClientRect();cssWidth=Math.max(1,rect.width);cssHeight=Math.max(1,rect.height);pixelRatio=Math.min(3,window.devicePixelRatio||1);
 const width=Math.max(1,Math.round(cssWidth*pixelRatio)),height=Math.max(1,Math.round(cssHeight*pixelRatio));
 if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
 render();
}
function render(){
 ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);ctx.clearRect(0,0,cssWidth,cssHeight);ctx.globalAlpha=1;
 const scale=Math.min(cssWidth/W,cssHeight/H);ctx.save();ctx.translate((cssWidth-W*scale)/2,(cssHeight-H*scale)/2);ctx.scale(scale,scale);ctx.imageSmoothingEnabled=true;
 if(progress===0&&!hidden){ctx.drawImage(source,0,0);}else if(ready){
  for(const c of chips){
   const q=motion(progress,c.spread),local=localMotion(progress,q);
   const x=position(c.x,c.hx,c.bendX,q,c.ax*.28*local),y=position(c.y,c.hy,c.bendY,q,c.ay*.16*local);
   const angle=rotationAt(c.rotation,c.spread,q,local);
   ctx.save();ctx.translate(x,y);ctx.rotate(angle);const grainScale=1-.18*q;ctx.scale(grainScale,grainScale);
   ctx.drawImage(atlas,c.atlasX,c.atlasY,c.w,c.h,c.left-c.x,c.top-c.y,c.w,c.h);ctx.restore();
  }
 }
 ctx.restore();
}
function sample(now){
 if(!animation)return;
 const t=clamp((now-animation.start)/animation.duration);progress=animation.from+(animation.to-animation.from)*t;
 if(t===1){progress=animation.to;animation=null;}
}
function tick(now){raf=0;sample(now);render();updateSemantics();if(animation)raf=requestAnimationFrame(tick);}
function setHidden(value,animate){
 sample(performance.now());if(raf)cancelAnimationFrame(raf);raf=0;animation=null;hidden=value;
 const target=hidden?1:0;
 // Remove the accessible value immediately, including while showing transitions.
 canvas.setAttribute('aria-label','Баланс скрыт');
 if(!animate||!ready||reduced.matches||Math.abs(progress-target)<.00001){progress=target;render();updateSemantics();return;}
 animation={from:progress,to:target,start:performance.now(),duration:Math.max(90,DURATION*Math.abs(progress-target))};
 updateSemantics();render();raf=requestAnimationFrame(tick);
}
async function prepare(){
 if(preparing)return;preparing=true;initError=null;button.disabled=true;canvas.setAttribute('aria-busy','true');
 const started=performance.now();
 try{
  // Do not rasterize a fallback font: wait for both embedded faces first.
  const loaded=await Promise.all([
   document.fonts.load('600 116px "Balance Poppins"',AMOUNT),
   document.fonts.load('600 15px "Balance Cyrillic"','Скрыть баланс Показать баланс Попробовать снова')
  ]);
  await document.fonts.ready;
  if(loaded.some(faces=>faces.length!==1||faces[0].status!=='loaded'))throw Error('Встроенный шрифт не загрузился');
  document.body.dataset.fontsReady='true';
  document.body.dataset.variant='sand';
  document.body.dataset.balanceFont='Poppins SemiBold 600';
  document.body.dataset.buttonFont='Noto Sans SemiBold 600 (Cyrillic)';
  paintSource();resize();await yieldTask();
  const data=sourceCtx.getImageData(0,0,W,H).data;
  const result=await partition(data),cloud=makeCloud(result.parts.length),style=new JavaRandom(9201);
  atlas=pack(result.parts);
  chips=result.parts.map((p,i)=>{
   const targetAngle=(style.float()-.5)*Math.PI;
   const spread=style.float()*.12,ax=(style.float()-.5)*18,ay=(style.float()-.5)*32;
   const bend=flightBend(p.x,p.y,ax,ay);
   return {left:p.left,top:p.top,w:p.w,h:p.h,x:p.x,y:p.y,tangent:p.tangent,atlasX:p.atlasX,atlasY:p.atlasY,hx:cloud[i].x,hy:cloud[i].y,rotation:targetAngle,spread,ax,ay,bendX:bend.x,bendY:bend.y};
  });
  const rings=[0,0,0,0];for(const p of cloud){const r2=((p.x-320)/270)**2+((p.y-75)/53)**2;rings[Math.min(3,Math.floor(r2*4))]++;}
  stats=Object.freeze({fragmentCount:chips.length,reconstructionExact:result.exact,visiblePixels:result.visible,antialiasedPixels:result.aa,cloudRings:Object.freeze(rings),preparationMs:Math.round(performance.now()-started),atlasWidth:atlas.width,atlasHeight:atlas.height});
  ready=true;document.body.dataset.ready='true';document.body.dataset.fragmentCount=String(chips.length);document.body.dataset.reconstructionOk=String(result.exact);document.body.dataset.preparationMs=String(stats.preparationMs);document.body.dataset.cloudRings=rings.join(',');document.body.dataset.visiblePixels=String(result.visible);document.body.dataset.aaPixels=String(result.aa);delete document.body.dataset.error;button.disabled=false;canvas.setAttribute('aria-busy','false');render();updateSemantics();
 }catch(error){initError=String(error);console.error('Magnetic balance initialization:',error);button.disabled=false;button.textContent='Попробовать снова';canvas.setAttribute('aria-busy','false');document.body.dataset.state='error';document.body.dataset.error=initError;}
 finally{preparing=false;}
}
button.addEventListener('click',()=>{if(!ready){prepare();return;}setHidden(!hidden,true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setHidden(true,false);});
window.addEventListener('pagehide',()=>setHidden(true,false));
window.addEventListener('pageshow',event=>{if(event.persisted)setHidden(true,false);});
window.addEventListener('resize',resize,{passive:true});
if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas);
const motionPreference=()=>{if(reduced.matches&&animation)setHidden(hidden,false);};
if(reduced.addEventListener)reduced.addEventListener('change',motionPreference);else if(reduced.addListener)reduced.addListener(motionPreference);
Object.defineProperty(window,'__sandBalanceDebug',{value:Object.freeze({snapshot:()=>Object.freeze({ready,hidden,progress,animating:!!animation,reducedMotion:reduced.matches,width:cssWidth,height:cssHeight,pixelRatio,error:initError,stats}),math:Object.freeze({smooth,motion,localMotion,field,position,duration:DURATION})}),writable:false,configurable:false});
prepare();
})();
</script>
